<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section id="formCard" class="card">
      <h1>Online Registration</h1>
      <p class="subtitle">Fill in your details and press Submit.</p>

      <form id="regForm" novalidate>
        <div class="grid">
          <div class="field">
            <label for="fullname">Full Name *</label>
            <input type="text" id="fullname" name="fullname" placeholder="Lakshmi R">
            <small class="error"></small>
          </div>

          <div class="field">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" placeholder="you@example.com">
            <small class="error"></small>
          </div>

          <div class="field">
            <label for="phone">Phone *</label>
            <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number">
            <small class="error"></small>
          </div>

          <div class="field">
            <label for="dob">Date of Birth *</label>
            <input type="date" id="dob" name="dob">
            <small class="error"></small>
          </div>

          <div class="field">
            <label>Gender *</label>
            <div class="inline">
              <label><input type="radio" name="gender" value="Female"> Female</label>
              <label><input type="radio" name="gender" value="Male"> Male</label>
              <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>
            <small class="error"></small>
          </div>

          <div class="field">
            <label for="course">Course *</label>
            <select id="course" name="course">
              <option value="">-- Select --</option>
              <option>B.E. Computer Science</option>
              <option>B.E. Information Science</option>
              <option>B.E. Electronics</option>
              <option>B.E. Mechanical</option>
              <option>MCA</option>
            </select>
            <small class="error"></small>
          </div>

          <div class="field full">
            <label>Interests</label>
            <div class="inline">
              <label><input type="checkbox" name="interests[]" value="Web Development"> Web Development</label>
              <label><input type="checkbox" name="interests[]" value="AI / ML"> AI / ML</label>
              <label><input type="checkbox" name="interests[]" value="Embedded Systems"> Embedded Systems</label>
              <label><input type="checkbox" name="interests[]" value="Cybersecurity"> Cybersecurity</label>
            </div>
          </div>

          <div class="field full">
            <label for="address">Address *</label>
            <textarea id="address" name="address" rows="3" placeholder="House no, street, city, PIN"></textarea>
            <small class="error"></small>
          </div>
        </div>

        <button type="submit" id="submitBtn">Submit</button>
      </form>
    </section>

    <section id="resultCard" class="card hidden"></section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
